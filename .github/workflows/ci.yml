name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - name: Install dependencies
        working-directory: Writer-Assistant
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: Writer-Assistant
        run: pnpm run typecheck
      - name: Test guest identity security
        working-directory: Writer-Assistant
        run: node --test artifacts/api-server/src/middlewares/identity.test.mjs
      - name: Build production app and API
        working-directory: Writer-Assistant
        run: pnpm run build:vercel
      - name: Verify tracked Vercel API bundle is current
        run: git diff --exit-code -- api/index.mjs
