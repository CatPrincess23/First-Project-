kind = "web"
previewPath = "/"
title = "WriteAI"
version = "1.0.0"
id = "artifacts/writer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25527

[services.development]
run = "pnpm --filter @workspace/writer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/writer", "run", "build" ]
publicDir = "artifacts/writer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25527"
BASE_PATH = "/"
